# Server
server.port=8082

# Service Discovery (Eureka)
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost

# Actuator endpoints
management.endpoints.web.exposure.include=health,info,refresh,env
management.endpoint.health.show-details=always

# Resilience4j Circuit Breaker
resilience4j.circuitbreaker.instances.userservice.slidingWindowSize=10
resilience4j.circuitbreaker.instances.userservice.failureRateThreshold=50
resilience4j.circuitbreaker.instances.userservice.waitDurationInOpenState=10000ms
resilience4j.circuitbreaker.instances.userservice.permittedNumberOfCallsInHalfOpenState=3

# Swagger/OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.packages-to-scan=com.example.notificationservice.controller
springdoc.paths-to-match=/**

# Kafka Consumer
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notification-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Email settings
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=test@gmail.com
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Logging
logging.level.com.example.notificationservice=DEBUG
logging.level.com.netflix.discovery=INFO
logging.level.org.springframework.cloud=INFO